workflows:
  android-workflow:
    name: ZX FF Tour APK
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Backup our files
        script: |
          cp lib/main.dart /tmp/main.dart.bak
          cp pubspec.yaml /tmp/pubspec.bak
      - name: Create Flutter project
        script: |
          flutter create . --project-name zx_ff_tour --org com.zx.fftour --platforms android
      - name: Restore our files
        script: |
          cp /tmp/main.dart.bak lib/main.dart
          cp /tmp/pubspec.bak pubspec.yaml
          cp google-services.json android/app/google-services.json
           - name: Fix Android SDK
        script: |
          sed -i '' 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle.kts
          sed -i '' 's/targetSdk = .*/targetSdk = 35/' android/app/build.gradle.kts
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
